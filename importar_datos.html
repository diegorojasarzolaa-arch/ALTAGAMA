function log(msg, cls) {
  var el = document.getElementById('log');
  el.style.display = 'block';
  el.innerHTML += '<div class="'+(cls||'info')+'">'+msg+'</div>';
  el.scrollTop = el.scrollHeight;
}

function setProgress(pct) {
  document.getElementById('pfill').style.width = pct + '%';
}

async function startImport() {
  var btn = document.getElementById('btn');
  btn.disabled = true;
  btn.textContent = 'Importando...';
  document.getElementById('pbar').style.display = 'block';

  log('Iniciando importación de ' + DATA.length + ' repuestos...');

  // First clear existing data
  try {
    var delResp = await fetch(SUPABASE_URL + '/rest/v1/repuestos?id=gte.0', {
      method: 'DELETE',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY,
        'Content-Type': 'application/json'
      }
    });
    log('Tabla limpiada ✓', 'ok');
  } catch(e) {
    log('Error limpiando: ' + e.message, 'err');
  }

  // Upload in batches of 200
  var BATCH = 200;
  var total = DATA.length;
  var errors = 0;

  for (var i = 0; i < total; i += BATCH) {
    var batch = DATA.slice(i, i + BATCH);
    try {
      var resp = await fetch(SUPABASE_URL + '/rest/v1/repuestos', {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': 'Bearer ' + SUPABASE_KEY,
          'Content-Type': 'application/json',
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify(batch)
      });

      if (resp.ok) {
        var pct = Math.round(((i + batch.length) / total) * 100);
        setProgress(pct);
        log('Subidos ' + Math.min(i + BATCH, total) + ' / ' + total + ' (' + pct + '%)', 'ok');
      } else {
        var err = await resp.text();
        log('Error en lote ' + (i/BATCH+1) + ': ' + err.substring(0,100), 'err');
        errors++;
      }
    } catch(e) {
      log('Error: ' + e.message, 'err');
      errors++;
    }
    // Small delay to avoid rate limiting
    await new Promise(r => setTimeout(r, 100));
  }

  if (errors === 0) {
    setProgress(100);
    log('✅ ¡Importación completada! ' + total + ' repuestos subidos.', 'ok');
    log('Ya puedes cerrar esta ventana y abrir la base de datos.', 'ok');
    btn.textContent = '✅ Completado';
    btn.style.background = '#16a34a';
  } else {
    log('⚠ Completado con ' + errors + ' errores.', 'err');
    btn.textContent = '⚠ Completado con errores';
    btn.disabled = false;
  }
}
