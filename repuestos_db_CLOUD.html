<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Base de Datos Repuestos — Altagama</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f14;--sur:#161920;--sur2:#1e2230;--bor:#2a2f40;--acc:#3b82f6;--grn:#22c55e;--red:#ef4444;--ylw:#f59e0b;--txt:#e8eaf0;--mut:#6b7280}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:'DM Sans',sans-serif}
.hdr{background:var(--sur);border-bottom:1px solid var(--bor);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;position:sticky;top:0;z-index:100}
.hdr h1{font-family:'Bebas Neue',sans-serif;font-size:1.7rem;letter-spacing:2px;color:var(--acc)}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.pill{padding:3px 11px;border-radius:20px;font-size:.75rem;font-weight:600}
.pt{background:rgba(59,130,246,.15);color:var(--acc);border:1px solid rgba(59,130,246,.3)}
.pd{background:rgba(34,197,94,.15);color:var(--grn);border:1px solid rgba(34,197,94,.3)}
.pv{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.3)}
.tbar{padding:10px 20px;display:flex;gap:7px;flex-wrap:wrap;align-items:center;background:var(--sur);border-bottom:1px solid var(--bor)}
.sb{flex:1;min-width:180px;max-width:360px;background:var(--bg);border:1px solid var(--bor);border-radius:8px;padding:8px 12px;color:var(--txt);font-family:'DM Sans',sans-serif;font-size:.85rem;outline:none}
.sb:focus{border-color:var(--acc)}
select{background:var(--bg);border:1px solid var(--bor);border-radius:8px;padding:7px 10px;color:var(--txt);font-family:'DM Sans',sans-serif;font-size:.82rem;outline:none;cursor:pointer}
select:focus{border-color:var(--acc)}
.btn{padding:8px 13px;border-radius:8px;border:none;font-family:'DM Sans',sans-serif;font-size:.83rem;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap}
.bp{background:var(--acc);color:#fff}.bg{background:var(--sur2);color:var(--txt);border:1px solid var(--bor)}
.cbar{padding:6px 20px;color:var(--mut);font-size:.78rem;border-bottom:1px solid var(--bor)}
.tw{overflow-x:auto;padding:14px 20px}
table{width:100%;border-collapse:collapse;font-size:.81rem}
th{background:var(--sur2);padding:9px 11px;text-align:left;font-weight:600;font-size:.69rem;letter-spacing:.8px;text-transform:uppercase;color:var(--mut);border-bottom:2px solid var(--bor);white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--txt)}th.sa::after{content:" ↑";color:var(--acc)}th.sd::after{content:" ↓";color:var(--acc)}th.ns{cursor:default}
tr{border-bottom:1px solid var(--bor);transition:background .1s}tr:hover{background:var(--sur2)}tr.sold{opacity:.38}
td{padding:8px 11px;vertical-align:middle}td.w{white-space:normal;max-width:160px;font-size:.76rem}
code{color:var(--acc);font-size:.79rem}
.bd{display:inline-block;padding:2px 8px;border-radius:20px;font-size:.69rem;font-weight:600}
.bda{background:rgba(34,197,94,.15);color:var(--grn);border:1px solid rgba(34,197,94,.3)}
.bdv{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.3)}
.bpub{background:rgba(59,130,246,.15);color:var(--acc);border:1px solid rgba(59,130,246,.3)}
.bnpub{background:rgba(107,114,128,.12);color:var(--mut);border:1px solid rgba(107,114,128,.2)}
.rp{background:rgba(59,130,246,.12);color:var(--acc);padding:2px 7px;border-radius:5px;font-size:.76rem;font-weight:600}
.ab{display:flex;gap:4px}
.ib{width:27px;height:27px;border-radius:6px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.78rem}
.ic{background:rgba(34,197,94,.2);color:var(--grn)}.ie{background:rgba(59,130,246,.2);color:var(--acc)}.it{background:rgba(245,158,11,.2);color:var(--ylw)}.ix{background:rgba(239,68,68,.2);color:var(--red)}
.ipub{background:rgba(59,130,246,.2);color:var(--acc)}.inpub{background:rgba(107,114,128,.2);color:var(--mut)}
.pg{display:flex;align-items:center;justify-content:center;gap:5px;padding:14px;flex-wrap:wrap}
.pb{width:31px;height:31px;border-radius:7px;border:1px solid var(--bor);background:var(--sur);color:var(--txt);cursor:pointer;font-size:.8rem;font-family:'DM Sans',sans-serif;display:flex;align-items:center;justify-content:center}
.pb:hover{background:var(--sur2);border-color:var(--acc)}.pb.act{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}.pb:disabled{opacity:.3;cursor:not-allowed}
.pi{color:var(--mut);font-size:.76rem}
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:200;align-items:center;justify-content:center}
.mo.open{display:flex}
.mb{background:var(--sur);border:1px solid var(--bor);border-radius:14px;padding:24px;width:100%;max-width:540px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.mb h2{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:1px;color:var(--acc);margin-bottom:16px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.ff{grid-column:1/-1}
.sl{grid-column:1/-1;font-size:.69rem;font-weight:700;color:var(--acc);letter-spacing:1.5px;text-transform:uppercase;padding-top:8px;border-top:1px solid var(--bor);margin-top:2px}
label{display:block;font-size:.7rem;font-weight:600;color:var(--mut);letter-spacing:.4px;text-transform:uppercase;margin-bottom:3px}
input[type=text],input[type=number],textarea,select.fs{width:100%;background:var(--bg);border:1px solid var(--bor);border-radius:7px;padding:7px 11px;color:var(--txt);font-family:'DM Sans',sans-serif;font-size:.87rem;outline:none}
textarea{resize:vertical;min-height:55px}input:focus,textarea:focus,select.fs:focus{border-color:var(--acc)}
.fa{display:flex;gap:9px;margin-top:16px;justify-content:flex-end}
.toast{position:fixed;bottom:20px;right:20px;background:var(--grn);color:#fff;padding:10px 16px;border-radius:9px;font-size:.83rem;font-weight:600;opacity:0;transform:translateY(8px);transition:all .25s;z-index:999;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}.toast.err{background:var(--red)}
.cloud-badge{background:rgba(34,197,94,.15);color:var(--grn);border:1px solid rgba(34,197,94,.3);padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:600}
@media(max-width:600px){.tbar,.tw{padding:9px 12px}.fg{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="hdr">
  <h1>🔧 REPUESTOS DB</h1>
  <div class="stats">
    <span class="pill pt" id="st">— Total</span>
    <span class="pill pd" id="sd">— Disponibles</span>
    <span class="pill pv" id="sv">— Vendidos</span>
    <span class="cloud-badge">☁️ En la nube</span>
  </div>
</div>
<div class="tbar">
  <input class="sb" id="sq" placeholder="🔍 Buscar repuesto, marca, modelo, repisa..." oninput="go()">
  <select id="fe" onchange="go()"><option value="">Todos</option><option value="true">Disponibles</option><option value="false">Vendidos</option></select>
  <select id="fp" onchange="go()"><option value="">Publicación</option><option value="true">Publicados</option><option value="false">Sin publicar</option></select>
  <select id="ft" onchange="go()"><option value="">Todos los tipos</option></select>
  <select id="fm" onchange="go()"><option value="">Todas las marcas</option></select>
  <button class="btn bp" onclick="openM(0)">＋ Agregar</button>
</div>
<div class="cbar" id="cb">⏳ Cargando datos desde la nube...</div>
<div class="tw"><table>
  <thead><tr>
    <th onclick="srt('repuesto')">Repuesto</th><th onclick="srt('marca')">Marca</th><th onclick="srt('modelo')">Modelo</th>
    <th onclick="srt('anio')">Año</th><th onclick="srt('version')">Versión</th><th onclick="srt('n_auto')">N° Auto</th>
    <th onclick="srt('cantidad')">Cant.</th><th onclick="srt('detalle')">Detalle</th><th onclick="srt('n_parte')">N° Parte</th>
    <th onclick="srt('repisa')">Repisa</th><th onclick="srt('piso')">Piso</th><th onclick="srt('precio')">Precio</th>
    <th onclick="srt('disponible')">Estado</th><th onclick="srt('publicado')">Publicado</th><th class="ns">Acciones</th>
  </tr></thead>
  <tbody id="tb"></tbody>
</table></div>
<div class="pg" id="pg2"></div>
<div class="mo" id="modal">
  <div class="mb">
    <h2 id="mt">Agregar</h2>
    <div class="fg">
      <div class="sl">Identificación</div>
      <div class="ff"><label>Repuesto</label><input type="text" id="xr" placeholder="Ej: FOCO IZQUIERDO"></div>
      <div><label>Marca</label><input type="text" id="xm"></div>
      <div><label>Modelo</label><input type="text" id="xmo"></div>
      <div><label>Año</label><input type="text" id="xa"></div>
      <div><label>Versión</label><input type="text" id="xv"></div>
      <div><label>N° Auto</label><input type="text" id="xn"></div>
      <div class="sl">Inventario</div>
      <div><label>Cantidad</label><input type="number" id="xc" min="0" value="1"></div>
      <div><label>Estado</label><select id="xd" class="fs"><option value="true">Disponible</option><option value="false">Vendido</option></select></div>
      <div><label>Repisa</label><input type="text" id="xrp"></div>
      <div><label>Piso</label><input type="text" id="xp"></div>
      <div><label>Precio</label><input type="text" id="xpr"></div>
      <div><label>N° Parte</label><input type="text" id="xnp"></div>
      <div class="ff"><label>Detalle</label><textarea id="xdet"></textarea></div>
    </div>
    <div class="fa">
      <button class="btn bg" onclick="closeM()">Cancelar</button>
      <button class="btn bp" onclick="saveIt()">Guardar</button>
    </div>
  </div>
</div>
<div class="toast" id="tst"></div>

<script>
var SB = "https://ihxcmkjibtfpybvuuucf.supabase.co";
var KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImloeGNta2ppYnRmcHlidnV1dWNmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5MDI3MzMsImV4cCI6MjA5MzQ3ODczM30.A9sxW0TWNU-t4Y15ty5PWDQlJHf_FJANzQPCozhBk5U";
var DB = [], flt = [], sc = 'repuesto', sdir = 1, pg = 1, eid = 0, PP = 30;
var allTipos = {}, allMarcas = {};

var H = {'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'};

async function fetchAll() {
  var all = [], from = 0, limit = 1000;
  while(true) {
    var r = await fetch(SB+'/rest/v1/repuestos?select=*&order=repuesto.asc&limit='+limit+'&offset='+from, {headers:H});
    var d = await r.json();
    if(!d.length) break;
    all = all.concat(d);
    if(d.length < limit) break;
    from += limit;
  }
  DB = all;
  DB.forEach(function(i){
    if(i.repuesto) allTipos[i.repuesto]=1;
    if(i.marca)    allMarcas[i.marca]=1;
  });
  fillSel('ft', Object.keys(allTipos).sort());
  fillSel('fm', Object.keys(allMarcas).sort());
  go();
}

function fillSel(id, arr) {
  var s=document.getElementById(id);
  // keep first option
  while(s.options.length>1) s.remove(1);
  arr.forEach(function(v){var o=document.createElement('option');o.value=v;o.textContent=v;s.appendChild(o);});
}

function go() {
  var q=document.getElementById('sq').value.toLowerCase().trim();
  var words=q.length===0?[]:q.split(' ').filter(function(w){return w.length>0;});
  var fe=document.getElementById('fe').value, fp=document.getElementById('fp').value, ft=document.getElementById('ft').value, fm=document.getElementById('fm').value;
  flt=DB.filter(function(i){
    var t=[i.repuesto,i.marca,i.modelo,i.anio,i.version,i.n_auto,i.detalle,i.n_parte,i.repisa,i.piso].join(' ').toLowerCase();
    if(words.length>0&&!words.every(function(w){return t.indexOf(w)>=0;}))return false;
    if(fe==='true'&&!i.disponible)return false; if(fe==='false'&&i.disponible)return false;
    if(fp==='true'&&!i.publicado)return false;  if(fp==='false'&&i.publicado)return false;
    if(ft&&i.repuesto!==ft)return false; if(fm&&i.marca!==fm)return false;
    return true;
  });
  flt.sort(function(a,b){
    var av=sc==='disponible'?(a.disponible?'1':'0'):sc==='publicado'?(a.publicado?'1':'0'):String(a[sc]||'').toLowerCase();
    var bv=sc==='disponible'?(b.disponible?'1':'0'):sc==='publicado'?(b.publicado?'1':'0'):String(b[sc]||'').toLowerCase();
    return av<bv?-sdir:av>bv?sdir:0;
  });
  var tot=DB.length, dsp=DB.filter(function(i){return i.disponible;}).length;
  document.getElementById('st').textContent=tot+' Total';
  document.getElementById('sd').textContent=dsp+' Disponibles';
  document.getElementById('sv').textContent=(tot-dsp)+' Vendidos';
  document.getElementById('cb').textContent=flt.length+' registros encontrados';
  pg=1; render();
}

function srt(col){sdir=sc===col?-sdir:1;sc=col;document.querySelectorAll('th').forEach(function(t){t.classList.remove('sa','sd');});var cols=['repuesto','marca','modelo','anio','version','n_auto','cantidad','detalle','n_parte','repisa','piso','precio','disponible','publicado'];var i=cols.indexOf(col);if(i>=0)document.querySelectorAll('th')[i].classList.add(sdir===1?'sa':'sd');go();}

function esc(v){return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function render(){
  var sl=flt.slice((pg-1)*PP,pg*PP); var rows='';
  sl.forEach(function(i){
    var badge=i.disponible?'<span class="bd bda">Disponible</span>':'<span class="bd bdv">Vendido</span>';
    var pbadge=i.publicado?'<span class="bd bpub">Publicado</span>':'<span class="bd bnpub">Sin publicar</span>';
    var rp=i.repisa?'<span class="rp">'+esc(i.repisa)+'</span>':'<span style="color:var(--mut)">—</span>';
    var pr=i.precio?'<span style="color:var(--grn);font-weight:600">$'+esc(i.precio)+'</span>':'';
    rows+='<tr class="'+(i.disponible?'':'sold')+'">'
      +'<td>'+esc(i.repuesto)+'</td><td>'+esc(i.marca)+'</td><td>'+esc(i.modelo)+'</td><td>'+esc(i.anio)+'</td>'
      +'<td class="w" style="color:var(--mut)">'+esc(i.version)+'</td><td><code>'+esc(i.n_auto)+'</code></td>'
      +'<td style="text-align:center">'+i.cantidad+'</td><td class="w" style="color:var(--ylw)">'+esc(i.detalle)+'</td>'
      +'<td style="color:var(--mut);font-size:.76rem">'+esc(i.n_parte)+'</td><td>'+rp+'</td>'
      +'<td style="color:var(--mut);font-size:.76rem">'+esc(i.piso)+'</td><td>'+pr+'</td>'
      +'<td>'+badge+'</td><td>'+pbadge+'</td>'
      +'<td><div class="ab">'
        +'<button class="ib ic" title="Copiar" onclick="cp('+i.id+')">📋</button>'
        +'<button class="ib ie" title="Editar" onclick="openM('+i.id+')">✏️</button>'
        +'<button class="ib it" title="Cambiar disponible" onclick="tog('+i.id+')">🔄</button>'
        +'<button class="ib '+(i.publicado?'ipub':'inpub')+'" title="Publicado" onclick="togPub('+i.id+')">'+(i.publicado?'📌':'📤')+'</button>'
        +'<button class="ib ix" title="Eliminar" onclick="del('+i.id+')">🗑</button>'
      +'</div></td></tr>';
  });
  document.getElementById('tb').innerHTML=rows; rpg();
}

function rpg(){var tot=Math.ceil(flt.length/PP);var el=document.getElementById('pg2');if(tot<=1){el.innerHTML='';return;}var h='<button class="pb" onclick="gp('+(pg-1)+')" '+(pg===1?'disabled':'')+'>&#8249;</button>';for(var i=1;i<=tot;i++){if(i===1||i===tot||Math.abs(i-pg)<=2)h+='<button class="pb'+(i===pg?' act':'')+'" onclick="gp('+i+')">'+i+'</button>';else if(Math.abs(i-pg)===3)h+='<span style="color:var(--mut)">…</span>';}h+='<button class="pb" onclick="gp('+(pg+1)+')" '+(pg===tot?'disabled':'')+'>&#8250;</button>';h+='<span class="pi">'+((pg-1)*PP+1)+'–'+Math.min(pg*PP,flt.length)+' de '+flt.length+'</span>';el.innerHTML=h;}
function gp(p){pg=p;render();window.scrollTo(0,0);}

function openM(id){
  eid=id;
  document.getElementById('mt').textContent=id?'Editar':'Agregar Repuesto';
  var i=id?DB.find(function(x){return x.id===id;}):{available:true};
  document.getElementById('xr').value=i.repuesto||'';document.getElementById('xm').value=i.marca||'';
  document.getElementById('xmo').value=i.modelo||'';document.getElementById('xa').value=i.anio||'';
  document.getElementById('xv').value=i.version||'';document.getElementById('xn').value=i.n_auto||'';
  document.getElementById('xc').value=i.cantidad!=null?i.cantidad:1;
  document.getElementById('xd').value=i.disponible!=null?String(i.disponible):'true';
  document.getElementById('xrp').value=i.repisa||'';document.getElementById('xp').value=i.piso||'';
  document.getElementById('xpr').value=i.precio||'';document.getElementById('xnp').value=i.n_parte||'';
  document.getElementById('xdet').value=i.detalle||'';
  document.getElementById('modal').classList.add('open');
  setTimeout(function(){document.getElementById('xr').focus();},100);
}
function closeM(){document.getElementById('modal').classList.remove('open');eid=0;}

function nid(){return DB.length?Math.max.apply(null,DB.map(function(i){return i.id;}))+1:1;}

async function saveIt(){
  var rep=document.getElementById('xr').value.trim().toUpperCase();
  if(!rep){toast('El repuesto es obligatorio',true);return;}
  var nd={
    repuesto:rep, marca:document.getElementById('xm').value.trim().toUpperCase(),
    modelo:document.getElementById('xmo').value.trim().toUpperCase(),
    anio:document.getElementById('xa').value.trim(),
    version:document.getElementById('xv').value.trim().toUpperCase(),
    n_auto:document.getElementById('xn').value.trim().toUpperCase(),
    cantidad:parseInt(document.getElementById('xc').value)||0,
    disponible:document.getElementById('xd').value==='true',
    repisa:document.getElementById('xrp').value.trim().toUpperCase(),
    piso:document.getElementById('xp').value.trim().toUpperCase(),
    precio:document.getElementById('xpr').value.trim(),
    n_parte:document.getElementById('xnp').value.trim(),
    detalle:document.getElementById('xdet').value.trim().toUpperCase(),
    publicado:false
  };
  if(eid){
    var r=await fetch(SB+'/rest/v1/repuestos?id=eq.'+eid,{method:'PATCH',headers:Object.assign({'Prefer':'return=minimal'},H),body:JSON.stringify(nd)});
    if(r.ok){var i=DB.find(function(x){return x.id===eid;});Object.assign(i,nd);toast('Actualizado ✓');}
    else toast('Error al guardar',true);
  }else{
    nd.id=nid();
    var r=await fetch(SB+'/rest/v1/repuestos',{method:'POST',headers:Object.assign({'Prefer':'return=minimal'},H),body:JSON.stringify(nd)});
    if(r.ok){DB.push(nd);toast('Agregado ✓');}
    else toast('Error al agregar',true);
  }
  closeM(); go();
}

async function tog(id){
  var i=DB.find(function(x){return x.id===id;});
  i.disponible=!i.disponible; i.cantidad=i.disponible?1:0;
  var r=await fetch(SB+'/rest/v1/repuestos?id=eq.'+id,{method:'PATCH',headers:Object.assign({'Prefer':'return=minimal'},H),body:JSON.stringify({disponible:i.disponible,cantidad:i.cantidad})});
  go(); toast(i.disponible?'✅ Disponible':'❌ Vendido');
}

async function togPub(id){
  var i=DB.find(function(x){return x.id===id;});
  i.publicado=!i.publicado;
  await fetch(SB+'/rest/v1/repuestos?id=eq.'+id,{method:'PATCH',headers:Object.assign({'Prefer':'return=minimal'},H),body:JSON.stringify({publicado:i.publicado})});
  go(); toast(i.publicado?'📌 Publicado':'📤 Sin publicar');
}

async function del(id){
  if(!confirm('¿Eliminar este repuesto?'))return;
  var r=await fetch(SB+'/rest/v1/repuestos?id=eq.'+id,{method:'DELETE',headers:Object.assign({'Prefer':'return=minimal'},H)});
  if(r.ok){DB=DB.filter(function(x){return x.id!==id;});go();toast('Eliminado');}
  else toast('Error al eliminar',true);
}

function cp(id){
  var i=DB.find(function(x){return x.id===id;});
  var txt=[i.repuesto,i.marca,i.modelo,i.anio,i.n_auto].filter(Boolean).join(' ');
  if(navigator.clipboard){navigator.clipboard.writeText(txt).then(function(){toast('¡Copiado! ✓');});}
  else{var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);toast('¡Copiado! ✓');}
}

function toast(msg,err){var t=document.getElementById('tst');t.textContent=msg;t.className='toast show'+(err?' err':'');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show');},2500);}
document.getElementById('modal').addEventListener('click',function(e){if(e.target===e.currentTarget)closeM();});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeM();if(e.key==='Enter'&&document.getElementById('modal').classList.contains('open'))saveIt();});

fetchAll();
</script>
</body></html>
